name: AppleMusicLyricsWidget
options:
  bundleIdPrefix: com.yuchen
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  AppleMusicLyricsWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppleMusicUsageDescription: 用來讀取目前 Apple Music 播放歌曲並同步顯示歌詞。
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - location
        NSLocationAlwaysAndWhenInUseUsageDescription: 選擇「永遠」才能在背景更新動態島歌詞。位置不會被使用或儲存。
        NSLocationWhenInUseUsageDescription: 僅用來讓 App 在背景持續更新動態島歌詞，不會使用或儲存你的位置。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    entitlements:
      path: App/AppleMusicLyricsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yuchen.AppleMusicLyricsWidget
    dependencies:
      - target: LyricsWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuchen.AppleMusicLyricsWidget
        INFOPLIST_KEY_CFBundleDisplayName: Lyrics Widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  LyricsWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lyrics Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/LyricsWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yuchen.AppleMusicLyricsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuchen.AppleMusicLyricsWidget.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
